<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Killnet XMD — Session ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#0d0b16;--card:#171326;--purple:#7c5cff;--purple2:#564fd8;--text:#f5f3ff;--muted:#aaa4bd;--input:#211c32;--success:#25d366;--danger:#ff5d73}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#21173c 0,#0d0b16 48%);font-family:Poppins,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:100%;max-width:470px;background:rgba(23,19,38,.96);border:1px solid rgba(124,92,255,.22);border-radius:24px;padding:28px;box-shadow:0 25px 80px rgba(0,0,0,.4)}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--purple),var(--purple2));display:grid;place-items:center;font-size:25px;margin:0 auto 16px;box-shadow:0 12px 35px rgba(124,92,255,.25)}
h1{text-align:center;font-size:24px;margin:0 0 7px}.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 25px;line-height:1.6}
label{display:block;font-size:12px;color:#c7c1d8;margin:0 0 8px}.input-wrap{display:flex;align-items:center;background:var(--input);border:1px solid #302a47;border-radius:14px;padding:0 14px}.input-wrap i{color:#8f86aa}.input-wrap input{width:100%;background:none;border:0;outline:0;color:#fff;padding:15px 10px;font:inherit;font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.btn{border:0;border-radius:13px;padding:14px 12px;text-decoration:none;text-align:center;font:600 13px Poppins;cursor:pointer}.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff}.secondary{background:#262039;color:#ddd}.btn:disabled{opacity:.55;cursor:not-allowed}
.result{display:none;margin-top:18px;background:#0f0d18;border:1px solid #2d2741;border-radius:15px;padding:15px}.result.show{display:block}.result-title{font-size:12px;color:#aaa4bd;margin-bottom:9px}.code{font-size:21px;font-weight:700;letter-spacing:2px;text-align:center;word-break:break-all}.session{font-size:11px;line-height:1.6;max-height:180px;overflow:auto;word-break:break-all;color:#e8e3f5;background:#151122;border-radius:10px;padding:11px}.status{font-size:12px;color:#aaa4bd;text-align:center;margin-top:12px;line-height:1.5}.copy{margin-top:10px;width:100%;background:#262039;color:#fff}.back{display:block;text-align:center;color:#9188ae;text-decoration:none;font-size:12px;margin-top:20px}
@media(max-width:420px){.actions{grid-template-columns:1fr}.card{padding:22px}}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><i class="fa-solid fa-key"></i></div>
  <h1>Session ID Generator</h1>
  <p class="sub">Enter your WhatsApp number, pair normally, then receive your Killnet XMD Base64 session ID.</p>

  <label for="phone">WhatsApp phone number</label>
  <div class="input-wrap"><i class="fa-solid fa-phone"></i><input id="phone" type="tel" placeholder="2567XXXXXXXX" autocomplete="tel"></div>

  <div class="actions">
    <button id="getCodeBtn" class="btn primary"><span id="btnText"><i class="fas fa-key"></i> Generate Code</span></button>
    <a href="/qr" class="btn secondary"><i class="fas fa-qrcode"></i> Use QR</a>
  </div>

  <div id="result" class="result">
    <div id="resultTitle" class="result-title">Pairing code</div>
    <div id="output" class="code">—</div>
    <button id="copyBtn" class="btn copy"><i class="fa-solid fa-copy"></i> Copy</button>
    <div id="status" class="status">Waiting for pairing…</div>
  </div>

  <a class="back" href="/">← Back to Pair Screen</a>
</div>
<script>
const phone=document.getElementById('phone');
const btn=document.getElementById('getCodeBtn');
const btnText=document.getElementById('btnText');
const result=document.getElementById('result');
const resultTitle=document.getElementById('resultTitle');
const output=document.getElementById('output');
const status=document.getElementById('status');
const copyBtn=document.getElementById('copyBtn');
let pollTimer=null;

function setBusy(busy){btn.disabled=busy;btnText.innerHTML=busy?'<i class="fas fa-spinner fa-spin"></i> Starting...':'<i class="fas fa-key"></i> Generate Code';}
function showStatus(t){status.textContent=t;}

btn.addEventListener('click',async()=>{
  const num=phone.value.replace(/[^0-9]/g,'');
  if(!num){showStatus('Enter your WhatsApp phone number first.');result.classList.add('show');return;}
  if(pollTimer)clearInterval(pollTimer);
  setBusy(true);result.classList.add('show');resultTitle.textContent='Pairing code';output.className='code';output.textContent='...';showStatus('Requesting pairing code…');
  try{
    const r=await fetch('/session-id?number='+encodeURIComponent(num));
    const data=await r.json();
    if(!r.ok||!data.code){throw new Error(data.error||'Could not generate pairing code');}
    output.textContent=data.code;showStatus('Enter this code in WhatsApp → Linked Devices → Link a device.');
    btnText.innerHTML='<i class="fas fa-spinner fa-spin"></i> Pairing...';
    pollTimer=setInterval(async()=>{
      try{
        const s=await fetch('/session-id?status='+encodeURIComponent(data.id));
        const d=await s.json();
        if(d.status==='ready'){
          clearInterval(pollTimer);pollTimer=null;resultTitle.textContent='Base64 Session ID';output.className='session';output.textContent=d.sessionId;showStatus('Session ID generated successfully. Keep it private.');btn.disabled=false;btnText.innerHTML='<i class="fas fa-check"></i> Done';
        }else if(d.status==='error'||d.status==='expired'){
          clearInterval(pollTimer);pollTimer=null;showStatus(d.error||'The pairing session expired. Generate a new code.');setBusy(false);
        }else{showStatus('Pairing in progress… keep WhatsApp open while the connection completes.');}
      }catch(e){console.error(e)}
    },3000);
  }catch(e){showStatus(e.message||'Service error');setBusy(false);}
});
copyBtn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(output.textContent);showStatus('Copied to clipboard.');}catch(e){showStatus('Copy failed — select and copy the text manually.');}});
</script>
</body>
</html>
