<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" sizes="32x32" href="https://files.catbox.moe/0oko4o.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EliteProTech | PAIRING CODE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #a855f7;
            --primary-dark: #5b21b6;
            --accent: #06b6d4;
            --accent-glow: #22d3ee;
            --text: #f8fafc;
            --text-light: #cbd5e1;
            --text-muted: #94a3b8;
            --background: #0a0a0f;
            --card-bg: rgba(20, 20, 35, 0.7);
            --input-bg: rgba(30, 30, 50, 0.6);
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --border: rgba(124, 58, 237, 0.3);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            --glow: 0 0 40px rgba(124, 58, 237, 0.4);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1.6;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(6, 182, 212, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.08) 0%, transparent 60%);
            z-index: -2;
            animation: gradientShift 20s ease infinite;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(124, 58, 237, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124, 58, 237, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
            mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-2%, 2%) scale(1.05); }
            66% { transform: translate(2%, -2%) scale(0.98); }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.6) 0%, rgba(124, 58, 237, 0) 70%);
            border-radius: 50%;
            animation: float linear infinite;
            filter: blur(0.5px);
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .home-btn {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(124, 58, 237, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(124, 58, 237, 0.4);
            color: var(--text);
            padding: 0.75rem 1.4rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .home-btn i {
            color: #25D366;
            font-size: 1.1rem;
        }

        .home-btn:hover {
            background: rgba(124, 58, 237, 0.3);
            border-color: rgba(124, 58, 237, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.3);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary-light), var(--accent), transparent);
            opacity: 0.8;
        }

        .container::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(124, 58, 237, 0.08) 60deg, transparent 120deg, rgba(6, 182, 212, 0.06) 180deg, transparent 240deg, rgba(168, 85, 247, 0.08) 300deg, transparent 360deg);
            animation: rotate 20s linear infinite;
            z-index: -1;
            opacity: 0.5;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            margin-bottom: 1.2rem;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .logo-wrapper i {
            font-size: 2rem;
            color: white;
        }

        .logo-wrapper::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            background: linear-gradient(135deg, var(--primary-light), var(--accent));
            z-index: -1;
            opacity: 0.5;
            filter: blur(10px);
        }

        h1 {
            color: var(--text);
            margin-bottom: 0.5rem;
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        h1 .gradient-text {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.6rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-light);
        }

        label i {
            color: var(--primary-light);
            font-size: 0.8rem;
        }

        .input-container {
            position: relative;
        }

        .input-container i.input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: var(--transition);
            pointer-events: none;
        }

        .input-prefix {
            position: absolute;
            left: 45px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
            pointer-events: none;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 16px 16px 70px;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            background-color: var(--input-bg);
            color: var(--text);
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            transition: var(--transition);
            letter-spacing: 0.5px;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0;
        }

        input[type="text"]:hover {
            border-color: rgba(124, 58, 237, 0.5);
            background-color: rgba(30, 30, 50, 0.8);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            background-color: rgba(30, 30, 50, 0.9);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
        }

        input[type="text"]:focus + i.input-icon,
        .input-container:focus-within i.input-icon {
            color: var(--primary-light);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .btn {
            position: relative;
            overflow: hidden;
            padding: 15px 20px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(124, 58, 237, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(6, 182, 212, 0.12);
            color: var(--accent-glow);
            border: 1.5px solid rgba(6, 182, 212, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(6, 182, 212, 0.2);
            border-color: rgba(6, 182, 212, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.25);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 16px;
            display: none;
            text-align: center;
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.08) 0%, rgba(6, 182, 212, 0.05) 100%);
            border: 1px solid rgba(124, 58, 237, 0.25);
            animation: fadeInUp 0.4s ease-out;
            position: relative;
            overflow: hidden;
        }

        #result::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .result-label {
            color: var(--text-light);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #pair-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            margin: 0.5rem 0 1rem;
            letter-spacing: 6px;
            padding: 1rem 1.5rem;
            background: rgba(10, 10, 20, 0.6);
            border-radius: 12px;
            border: 1px dashed rgba(124, 58, 237, 0.4);
            display: inline-block;
            position: relative;
            text-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
        }

        .result-hint {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .result-hint i {
            color: var(--warning);
        }

        #loading-spinner {
            display: none;
            margin: 1.5rem 0;
        }

        .spinner {
            width: 44px;
            height: 44px;
            margin: 0 auto;
            border: 3px solid rgba(124, 58, 237, 0.2);
            border-top: 3px solid var(--primary-light);
            border-right: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .action-buttons {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .action-btn {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
        }

        .copy-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
        }

        .back-btn {
            background: transparent;
            color: var(--text-light);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .error-message {
            color: var(--error);
            margin-top: 0.6rem;
            font-size: 0.85rem;
            display: none;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 0.85rem;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .success-message {
            color: var(--success);
            margin-top: 0.75rem;
            font-size: 0.85rem;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-weight: 500;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .shake {
            animation: shake 0.5s;
        }

        .footer-info {
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .footer-info i {
            color: var(--primary-light);
        }

        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(124, 58, 237, 0.4); }
            50% { text-shadow: 0 0 30px rgba(124, 58, 237, 0.7), 0 0 10px rgba(6, 182, 212, 0.4); }
        }

        #pair-code {
            animation: textGlow 3s ease-in-out infinite;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .container {
                padding: 2rem 1.4rem;
                border-radius: 20px;
            }
            h1 {
                font-size: 1.4rem;
            }
            .logo-wrapper {
                width: 64px;
                height: 64px;
            }
            .logo-wrapper i {
                font-size: 1.7rem;
            }
            #pair-code {
                font-size: 1.5rem;
                letter-spacing: 4px;
                padding: 0.85rem 1.2rem;
            }
            .btn-group {
                grid-template-columns: 1fr;
            }
            .home-btn {
                top: 1rem;
                right: 1rem;
                padding: 0.55rem 1rem;
                font-size: 0.8rem;
            }
            .home-btn span {
                display: none;
            }
            .action-buttons {
                flex-direction: column;
            }
        }

        /* Loading overlay for button */
        .btn-spinner-icon {
            display: none;
            font-size: 1rem;
        }

        .btn-loading .btn-text-label {
            display: none;
        }

        .btn-loading .btn-spinner-icon {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <a href="https://whatsapp.com/channel/0029VaXaqHII1rcmdDBBsd3g" class="home-btn">
        <i class="fab fa-whatsapp"></i>
        <span>Channel</span>
    </a>
    
    <div class="container">
        <div class="logo-wrapper">
            <i class="fas fa-link"></i>
        </div>
        
        <h1>Elite<span class="gradient-text">ProTech</span><br>Pairing Code</h1>
        <p class="subtitle">Securely link your WhatsApp device in seconds</p>
        
        <div class="form-group">
            <label for="phone-number">
                <i class="fas fa-phone"></i> Phone Number
            </label>
            <div class="input-container">
                <i class="fas fa-comment input-icon"></i>
                <span class="input-prefix">+</span>
                <input type="text" id="phone-number" placeholder="234xxxxxxxx" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
            </div>
            <div class="error-message" id="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span>Please enter a valid phone number (10-15 digits)</span>
            </div>
        </div>
        
        <div class="btn-group">
            <button id="getCodeBtn" class="btn btn-primary">
                <span class="btn-text-label"><i class="fas fa-bolt"></i> Get Code</span>
                <span class="btn-spinner-icon"><i class="fas fa-spinner fa-spin"></i></span>
            </button>
            <a href="/qr" class="btn btn-secondary">
                <i class="fas fa-qrcode"></i> QR Code
            </a>
        </div>

        <div id="loading-spinner" class="spinner"></div>
        
        <div id="result">
            <div class="result-label">Your Pairing Code</div>
            <div id="pair-code"></div>
            <div class="result-hint">
                <i class="fas fa-info-circle"></i>
                <span>Enter this code in WhatsApp → Linked Devices</span>
            </div>
            
            <div class="action-buttons">
                <button id="copy-btn" class="action-btn copy-btn">
                    <i class="fas fa-copy"></i> Copy Code
                </button>
                <a href="./" class="action-btn back-btn">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
            </div>
            
            <div class="success-message" id="success-message">
                <i class="fas fa-check-circle"></i> Code copied to clipboard!
            </div>
        </div>

        <div class="footer-info">
            <i class="fas fa-shield-alt"></i>
            <span>Powered by EliteProTech • End-to-End Secure</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
    <script>
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 18 : 35;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 8 + 3;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                particle.style.left = `${Math.random() * 100}%`;
                
                const duration = Math.random() * 15 + 12;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${Math.random() * 10}s`;
                
                particle.style.opacity = Math.random() * 0.6 + 0.2;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        createParticles();

        const submitButton = document.getElementById('getCodeBtn');
        const phoneNumberInput = document.getElementById('phone-number');
        const resultDiv = document.getElementById('result');
        const pairCodeDiv = document.getElementById('pair-code');
        const copyButton = document.getElementById('copy-btn');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const loadingSpinner = document.getElementById('loading-spinner');

        function validatePhoneNumber(number) {
            const cleaned = number.replace(/\D/g, '');
            return cleaned.length >= 10 && cleaned.length <= 15;
        }

        submitButton.addEventListener('click', async (e) => {
            e.preventDefault();
            const phoneNumber = phoneNumberInput.value.trim();
            
            if (!validatePhoneNumber(phoneNumber)) {
                errorMessage.style.display = 'flex';
                errorMessage.classList.add('shake');
                setTimeout(() => {
                    errorMessage.classList.remove('shake');
                }, 500);
                return;
            }
            
            errorMessage.style.display = 'none';
            
            submitButton.classList.add('btn-loading');
            submitButton.disabled = true;
            loadingSpinner.style.display = 'block';
            
            try {
                const { data } = await axios.get(`/code?number=${phoneNumber}`);
                const code = data.code || "ERROR";
                
                pairCodeDiv.textContent = code;
                resultDiv.style.display = 'block';
                loadingSpinner.style.display = 'none';
                
                resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                
            } catch (error) {
                pairCodeDiv.textContent = "SERVICE ERROR";
                resultDiv.style.display = 'block';
                loadingSpinner.style.display = 'none';
                console.error("Error:", error);
            } finally {
                submitButton.classList.remove('btn-loading');
                submitButton.disabled = false;
            }
        });

        copyButton.addEventListener('click', () => {
            const code = pairCodeDiv.textContent;
            navigator.clipboard.writeText(code).then(() => {
                successMessage.style.display = 'flex';
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 2000);
            });
        });

        phoneNumberInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
            
            if (errorMessage.style.display === 'flex') {
                errorMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
